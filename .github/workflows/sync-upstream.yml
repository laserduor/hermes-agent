name: Sync Upstream

on:
  schedule:
    - cron: "0 5 * * *"   # 每天 5:00 UTC，在构建之前同步
  workflow_dispatch:       # 手动触发

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          # Push 必须用 PAT：GITHUB_TOKEN 推送含 .github/workflows/* 改动的合并会被拒
          # （"refusing ... to create or update workflow ... without `workflows` permission"）。
          # 顺带好处：PAT 的 push 会自然触发 build-and-publish。
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "laserduor"
          git config user.email "312182928+laserduor@users.noreply.github.com"

      - name: Merge upstream changes
        id: merge
        run: |
          bash scripts/merge-upstream.sh

      - name: Push to fork
        if: steps.merge.outcome == 'success'
        run: |
          CURRENT=$(git rev-parse HEAD)
          ORIGINAL=$(git rev-parse origin/main)
          if [ "$CURRENT" != "$ORIGINAL" ]; then
            git push origin main
            echo "Pushed new commits (build workflow will run at 06:00 UTC)"
          else
            echo "No new commits to push"
          fi